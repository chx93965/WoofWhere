apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: danwonger/frontend-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VITE_API_URL
              value: "http://app-service.default.svc.cluster.local:4001"
            - name: VITE_MAPBOX_ACCESS_TOKEN
              value: "pk.eyJ1IjoidGFudml3b29md2hlcmUiLCJhIjoiY21odHQydmw4MDJ4YTJqcGpveWJwdXA0NCJ9.UJsNRn75p8UnJwTTKxB46Q"