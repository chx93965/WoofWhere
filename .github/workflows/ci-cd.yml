name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - pet_profile_update
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/app-app-service
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-web

jobs:
  # Job 1: Build Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/App/package-lock.json

      - name: Install dependencies
        working-directory: backend/App
        run: npm ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${IMAGE_TAG} ./backend/App

      - name: Push Docker image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${IMAGE_TAG}

  # Job 2: Build Frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG} ./frontend

      - name: Push Docker image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG}
          docker push ${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG}

  # Job 3: Deploy to Minikube
  deploy-minikube:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.28.0

      - name: Deploy Database
        run: |
          kubectl apply -f k8s/secrets/postgres-secret.yaml
          kubectl apply -f k8s/configmaps/postgres-config.yaml
          kubectl apply -f k8s/volumes/postgres-volume.yaml
          kubectl apply -f k8s/volumes/postgres-claim.yaml
          kubectl apply -f k8s/deployments/postgres.yaml
          kubectl apply -f k8s/services/postgres-service.yaml
          kubectl wait --for=condition=ready pod -l app=postgres --timeout=120s

      - name: Deploy Backend
        run: |
          kubectl apply -f k8s/secrets/app-secret.yaml
          kubectl apply -f k8s/deployments/app.yaml
          kubectl apply -f k8s/services/app-service.yaml
          kubectl wait --for=condition=ready pod -l app=app --timeout=180s

      - name: Deploy Frontend
        run: |
          kubectl apply -f k8s/deployments/frontend.yaml
          kubectl apply -f k8s/services/frontend-service.yaml
          kubectl wait --for=condition=ready pod -l app=frontend --timeout=120s

      - name: Run smoke tests
        run: |
          kubectl port-forward svc/frontend-service 8001:80 &
          sleep 5
          curl -f http://localhost:8001 || exit 1

