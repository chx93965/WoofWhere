name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      # TODO: remove in production
      - CI/CD
  pull_request:
    branches:
      - main
      # TODO: remove in production
      - CI/CD

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/app-app-service
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-web

jobs:
  # Job 1: Build and Test Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/App/package-lock.json

      - name: Install dependencies
        working-directory: backend/App
        run: npm ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ IMAGE_TAG }} ./backend/App

      - name: Push Docker image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ IMAGE_TAG }}

